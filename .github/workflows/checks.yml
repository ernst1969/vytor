name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vytor
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: vytor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vytor:test-password@localhost:5432/vytor_test
      TEST_DATABASE_URL: postgresql://vytor:test-password@localhost:5432/vytor_test
      EXPO_PUBLIC_API_URL: https://api.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p server/tsconfig.json
      - run: npm run test:ui
      - run: npm test
        working-directory: server
      - run: npm run test:integration
        working-directory: server
      - run: npx expo export --platform all --output-dir /tmp/vytor-export
      - name: Reject an insecure release API URL
        run: |
          if EXPO_PUBLIC_API_URL=http://localhost:3000 npx expo export --platform all --output-dir /tmp/vytor-insecure-export; then
            echo "Release export unexpectedly accepted HTTP" >&2
            exit 1
          fi
